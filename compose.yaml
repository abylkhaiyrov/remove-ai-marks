name: remove-ai-marks

services:
  watermarks-remover:
    image: ghcr.io/guillaumemeyer/watermarks-remover:v0.7.0
    # v0.7.0 is published for linux/amd64 only. Docker Desktop on Apple
    # Silicon transparently emulates this platform.
    platform: linux/amd64
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      WATERMARKS_SERVER_API_KEY: ${WATERMARKS_SERVER_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8765/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
